name: Linux host toolchains
on:
  pull_request:
    paths:
      - "sweetpad-cli/src/cli/linux_setup/**"
      - "sweetpad-cli/src/cli/commands/setup.rs"
      - "sweetpad-lib/ci/linux-toolchain.json"
      - ".github/workflows/linux-hosts.yaml"
  push:
    branches: [main]
    paths:
      - "sweetpad-cli/src/cli/linux_setup/**"
      - "sweetpad-cli/src/cli/commands/setup.rs"
      - "sweetpad-lib/ci/linux-toolchain.json"
      - ".github/workflows/linux-hosts.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    name: ${{ matrix.image }} / ${{ matrix.arch }} host tools (no Apple SDK)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "ubuntu:24.04", arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {image: "ubuntu:24.04", arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {image: "debian:12", arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {image: "debian:12", arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {image: "debian:13", arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {image: "debian:13", arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {image: "archlinux:base", arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Install pinned Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # A static binary runs in every image, as the released one does.
      - name: Build the static CLI
        run: cargo build --locked -p sweetpad-cli --bin sweetpad --target ${{ matrix.target }} -j 4
      - name: Set up a fresh host and build a Swift package
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "linux/$ARCH" -v "$PWD/target/${{ matrix.target }}/debug/sweetpad:/usr/local/bin/sweetpad:ro" "$IMAGE" bash -euc '
            if command -v apt-get >/dev/null; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -yqq ca-certificates
            else
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm ca-certificates
            fi
            sweetpad setup --no-sdk --non-interactive
            # A second run finds everything in place.
            sweetpad setup --no-sdk --non-interactive -o ndjson | grep -q "\"status\":\"ready\""
            source "$HOME/.config/sweetpad/linux-env.sh"
            mkdir /tmp/host-probe
            cd /tmp/host-probe
            swift package init --type executable --name HostProbe
            printf "import Foundation\nprint(\"SwiftPM host probe: \" + ProcessInfo.processInfo.operatingSystemVersionString)\n" > Sources/main.swift
            swift build --jobs 2
            .build/debug/HostProbe
          '
