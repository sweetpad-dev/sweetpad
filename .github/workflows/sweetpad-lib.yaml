name: sweetpad-lib

on:
  push:
    branches: [main]
    paths:
      - "sweetpad-lib/**"
      - "sweetpad-core/**"
      - "sweetpad-cli/**"
      - "sweetpad-vscode/native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/sweetpad-lib.yaml"
  pull_request:
    paths:
      - "sweetpad-lib/**"
      - "sweetpad-core/**"
      - "sweetpad-cli/**"
      - "sweetpad-vscode/native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/sweetpad-lib.yaml"

# The fast nets resolve against the committed `sweetpad-lib/xcspec-cache/`, so
# they need no Xcode and form the always-on regression gate — the BSP
# arg-invariant linter, the compiler-args/settings oracles, and the parsers.
#
# The heavy tiers are NOT run here: they need a real Xcode (BSP_ORACLE_XCODE,
# else the selected one) plus the gitignored OSS corpus, so they're run
# locally / nightly off-CI —
#   BSP_CORPUS=1     cargo test -p sweetpad-core --test bsp_corpus_completion
#   BSP_LIVE_DIFF=1  cargo test -p sweetpad-core --test showbuildsettings_live_diff
#   python3 sweetpad-lib/scripts/21_mutation_audit.py [--e2e]

jobs:
  linux:
    name: Linux · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev pkg-config
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Xcode subprocess integration tests run in the macOS job below.
      - name: Unit tests without Apple SDKs
        run: cargo test --workspace --lib -- --test-threads=1
      - name: Python regression checks
        run: python3 -B -m unittest discover -s sweetpad-lib/ci -p 'test_*.py'
  check:
    name: fmt · clippy · test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # Installs the channel + components pinned in rust-toolchain.toml.
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
