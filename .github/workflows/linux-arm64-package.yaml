name: Linux packages
on:
  push:
    branches: [main]
    paths:
      - "sweetpad-cli/**"
      - "sweetpad-core/**"
      - "sweetpad-lib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/linux-arm64-package.yaml"
      - ".github/workflows/cli-release.yaml"
      - ".github/workflows/cli-distribute.yaml"
  pull_request:
    paths:
      - "sweetpad-cli/**"
      - "sweetpad-core/**"
      - "sweetpad-lib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/linux-arm64-package.yaml"
      - ".github/workflows/cli-release.yaml"
      - ".github/workflows/cli-distribute.yaml"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.arch }} static archive, Debian package and clean installs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_arch: arm64
            target: aarch64-unknown-linux-musl
          - arch: x64
            runner: ubuntu-24.04
            docker_arch: amd64
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools cmake ninja-build perl pkg-config dpkg-dev apt-utils gnupg python3-cryptography
      - name: Install pinned Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Validate SDK archive safety and bootstrap syntax
        run: |
          python3 -m unittest discover -s sweetpad-lib/ci -p test_linux_sdk.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_linux_host.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_xcode_archive.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_linux_release.py
          python3 -m unittest discover -s sweetpad-cli/ci -p test_linux_package.py
          python3 -m unittest discover -s sweetpad-cli/ci -p test_linux_apt.py
          python3 -m unittest discover -s sweetpad-cli/ci -p test_device_discovery.py
          bash -n sweetpad-lib/ci/linux-setup.sh sweetpad-lib/ci/linux-host-tools.sh
      - uses: Swatinem/rust-cache@v2
      - name: Check static CLI and HTTPS
        run: |
          cargo test --release --locked -p sweetpad-cli --lib --target ${{ matrix.target }} -j 4
          cargo test --release --locked -p sweetpad-cli --lib --target ${{ matrix.target }} static_https_uses_host_certificate_store -- --ignored
      - name: Build static Linux release CLI
        run: cargo build --release --locked -p sweetpad-cli --bin sweetpad --target ${{ matrix.target }} -j 4
      - name: Package standalone binary and Debian package
        run: |
          VERSION="$(python3 sweetpad-cli/ci/release-version.py)"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 sweetpad-cli/ci/package-linux.py --binary target/${{ matrix.target }}/release/sweetpad --version "$VERSION" --out dist --deb
          python3 sweetpad-cli/ci/package-linux.py --binary target/${{ matrix.target }}/release/sweetpad --version "$VERSION" --out "$RUNNER_TEMP/deb-upgrade" --deb --deb-revision 2
      - name: Install in a clean Ubuntu 24.04 container
        run: |
          mkdir -p "$RUNNER_TEMP/package-smoke"
          docker run --rm --platform linux/${{ matrix.docker_arch }} \
            -v "$PWD/dist:/artifacts:ro" \
            -v "$PWD/sweetpad-cli/ci:/validation/sweetpad-cli/ci:ro" \
            -v "$RUNNER_TEMP/package-smoke:/reports" ubuntu:24.04 bash -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -yqq python3 ca-certificates
              python3 /validation/sweetpad-cli/ci/check-linux-package.py --archive "$(find /artifacts -maxdepth 1 -name "*.tar.gz")" --out /reports/install
            '
      - name: Check Debian install, upgrade and removal
        run: |
          docker run --rm --platform linux/${{ matrix.docker_arch }} \
            -v "$PWD/dist:/artifacts:ro" \
            -v "$RUNNER_TEMP/deb-upgrade:/upgrade:ro" \
            -v "$PWD/sweetpad-cli/ci:/validation/sweetpad-cli/ci:ro" \
            -v "$RUNNER_TEMP/package-smoke:/reports" ubuntu:24.04 bash -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -yqq python3 ca-certificates
              python3 /validation/sweetpad-cli/ci/check-linux-deb.py --package "$(find /artifacts -name "*.deb")" --upgrade "$(find /upgrade -name "*.deb")" --out /reports/debian
            '
      - name: Check signed APT install and upgrade
        run: |
          python3 sweetpad-cli/ci/check-linux-apt.py --package-dir dist --upgrade-dir "$RUNNER_TEMP/deb-upgrade" --out "$RUNNER_TEMP/package-smoke/apt"
      - name: Check CLI without glibc
        run: |
          docker run --rm --platform linux/${{ matrix.docker_arch }} -v "$PWD/dist:/artifacts:ro" alpine:3.22 sh -euc '
            mkdir /tool
            tar -xzf /artifacts/*.tar.gz -C /tool
            /tool/sweetpad --version
            /tool/sweetpad-dap --help
          '
      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-install-report
          path: ${{ runner.temp }}/package-smoke/**/*.json
          if-no-files-found: warn
      - name: Upload verified release package
        uses: actions/upload-artifact@v7
        with:
          name: cli-tarball-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
