name: Linux packages
on:
  push:
    branches: [main]
    paths:
      - "sweetpad-cli/**"
      - "sweetpad-core/**"
      - "sweetpad-lib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/linux-arm64-package.yaml"
      - ".github/workflows/cli-release.yaml"
      - ".github/workflows/cli-distribute.yaml"
  pull_request:
    paths:
      - "sweetpad-cli/**"
      - "sweetpad-core/**"
      - "sweetpad-lib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/linux-arm64-package.yaml"
      - ".github/workflows/cli-release.yaml"
      - ".github/workflows/cli-distribute.yaml"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  swift-helpers:
    name: ${{ matrix.arch }} Swift Build and macro plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: ubuntu-24.04-arm, docker_arch: arm64}
          - {arch: x64, runner: ubuntu-24.04, docker_arch: amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The staged output is cached whole: it changes only with these inputs.
      - name: Restore helpers built from the same inputs
        id: cache
        uses: actions/cache@v4
        with:
          path: swift-helpers
          key: swift-helpers-${{ matrix.arch }}-${{ hashFiles('sweetpad-lib/ci/build-swift-helpers.sh', 'sweetpad-lib/ci/swift-helpers-NOTICE.md', 'sweetpad-lib/ci/swift-build-*.patch', 'sweetpad-lib/ci/swift-llbuild-*.patch', 'sweetpad-lib/ci/swift-build-Package.resolved', 'sweetpad-lib/ci/linux-toolchain.json', 'sweetpad-lib/ci/linux-host-tools.sh', 'sweetpad-cli/macros/**') }}
      # Debian 12 has the oldest glibc the package supports, and the
      # runtime libraries come from swift.org's Debian 12 toolchain.
      - name: Build on Debian 12 against the pinned Swift
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --platform linux/${{ matrix.docker_arch }} -v "$PWD:/src" debian:12 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -yqq python3 ca-certificates patchelf
            SWIFT_VERSION="$(python3 -c "import json; print(json.load(open(\"/src/sweetpad-lib/ci/linux-toolchain.json\"))[\"swift\"])")"
            . /src/sweetpad-lib/ci/linux-host-tools.sh
            sweetpad_install_host_tools
            git config --global --add safe.directory "*"
            bash /src/sweetpad-lib/ci/build-swift-helpers.sh /src/swift-helpers
            chown -R "$(stat -c %u:%g /src)" /src/swift-helpers
          '
      - name: Check the helpers start with no Swift installed
        run: |
          docker run --rm --platform linux/${{ matrix.docker_arch }} -v "$PWD/swift-helpers:/helpers:ro" debian:12 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -yqq libsqlite3-0 libstdc++6
            ! command -v swift
            /helpers/libexec/sweetpad/swbuild --version
            /helpers/libexec/sweetpad/sweetpad-macros --help > /dev/null
          '
      - name: Archive the helpers
        run: tar -C swift-helpers -czf swift-helpers-linux-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: swift-helpers-linux-${{ matrix.arch }}
          path: swift-helpers-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  darwin-linker:
    name: ${{ matrix.arch }} LLD and dsymutil
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: ubuntu-24.04-arm, docker_arch: arm64}
          - {arch: x64, runner: ubuntu-24.04, docker_arch: amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned LLVM
        id: pin
        run: echo "llvm=$(jq -r '.llvm + "-" + .llvmSourceSha256[0:12]' sweetpad-lib/ci/linux-toolchain.json)" >> "$GITHUB_OUTPUT"
      # LLVM takes about an hour to build here, so the staged output is
      # cached by the pinned release and the script that builds it.
      - name: Restore the linker built from the same inputs
        id: cache
        uses: actions/cache@v4
        with:
          path: darwin-linker
          key: darwin-linker-${{ matrix.arch }}-${{ steps.pin.outputs.llvm }}-${{ hashFiles('sweetpad-lib/ci/build-darwin-linker.sh') }}
      - name: Build on Debian 12 from the pinned LLVM release
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --platform linux/${{ matrix.docker_arch }} -v "$PWD:/src" debian:12 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends cmake ninja-build g++ python3 xz-utils curl ca-certificates binutils
            bash /src/sweetpad-lib/ci/build-darwin-linker.sh /src/darwin-linker
            chown -R "$(stat -c %u:%g /src)" /src/darwin-linker
          '
      - name: Check both tools start on Debian 12
        run: |
          docker run --rm --platform linux/${{ matrix.docker_arch }} -v "$PWD/darwin-linker:/linker:ro" debian:12 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -yqq libstdc++6
            (exec -a ld64.lld /linker/libexec/sweetpad/llvm --version) | grep -q "^LLD "
            (exec -a dsymutil /linker/libexec/sweetpad/llvm --version) | grep -q "LLVM version"
          '
      - name: Archive the linker
        run: tar -C darwin-linker -czf darwin-linker-linux-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-linker-linux-${{ matrix.arch }}
          path: darwin-linker-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  package:
    name: ${{ matrix.arch }} static archive, Debian package and clean installs
    needs: [swift-helpers, darwin-linker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_arch: arm64
            target: aarch64-unknown-linux-musl
          - arch: x64
            runner: ubuntu-24.04
            docker_arch: amd64
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools cmake ninja-build perl pkg-config dpkg-dev apt-utils gnupg python3-cryptography
      - name: Install pinned Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Validate SDK archive safety and bootstrap syntax
        run: |
          python3 -m unittest discover -s sweetpad-lib/ci -p test_linux_sdk.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_linux_sdk_platforms.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_apple_auth.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_xcode_download.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_linux_host.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_xcode_archive.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_linux_release.py
          python3 -m unittest discover -s sweetpad-lib/ci -p test_sdk_tree.py
          python3 -m unittest discover -s sweetpad-cli/ci -p test_linux_package.py
          python3 -m unittest discover -s sweetpad-cli/ci -p test_linux_apt.py
          python3 -m unittest discover -s sweetpad-cli/ci -p test_device_discovery.py
          bash -n sweetpad-lib/ci/linux-setup.sh sweetpad-lib/ci/linux-host-tools.sh sweetpad-lib/ci/build-swift-helpers.sh sweetpad-lib/ci/build-darwin-linker.sh
      - uses: Swatinem/rust-cache@v2
      - name: Check static CLI and HTTPS
        run: |
          cargo test --release --locked -p sweetpad-cli --lib --target ${{ matrix.target }} -j 4
          cargo test --release --locked -p sweetpad-cli --lib --target ${{ matrix.target }} static_https_uses_host_certificate_store -- --ignored
      - name: Build static Linux release CLI
        run: cargo build --release --locked -p sweetpad-cli --bin sweetpad --target ${{ matrix.target }} -j 4
      - uses: actions/download-artifact@v8
        with:
          name: swift-helpers-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: darwin-linker-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Package standalone binary and Debian package
        run: |
          VERSION="$(python3 sweetpad-cli/ci/release-version.py)"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          HELPERS="$RUNNER_TEMP/swift-helpers"
          mkdir -p "$HELPERS"
          tar -xzf "$RUNNER_TEMP/swift-helpers-linux-${{ matrix.arch }}.tar.gz" -C "$HELPERS"
          LINKER="$RUNNER_TEMP/darwin-linker"
          mkdir -p "$LINKER"
          tar -xzf "$RUNNER_TEMP/darwin-linker-linux-${{ matrix.arch }}.tar.gz" -C "$LINKER"
          python3 sweetpad-cli/ci/package-linux.py --binary target/${{ matrix.target }}/release/sweetpad --helpers "$HELPERS" --linker "$LINKER" --version "$VERSION" --out dist --deb
          python3 sweetpad-cli/ci/package-linux.py --binary target/${{ matrix.target }}/release/sweetpad --helpers "$HELPERS" --linker "$LINKER" --version "$VERSION" --out "$RUNNER_TEMP/deb-upgrade" --deb --deb-revision 2
      - name: Install in a clean Ubuntu 24.04 container
        run: |
          mkdir -p "$RUNNER_TEMP/package-smoke"
          docker run --rm --platform linux/${{ matrix.docker_arch }} \
            -v "$PWD/dist:/artifacts:ro" \
            -v "$PWD/sweetpad-cli/ci:/validation/sweetpad-cli/ci:ro" \
            -v "$RUNNER_TEMP/package-smoke:/reports" ubuntu:24.04 bash -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -yqq python3 ca-certificates libsqlite3-0
              python3 /validation/sweetpad-cli/ci/check-linux-package.py --archive "$(find /artifacts -maxdepth 1 -name "*.tar.gz")" --out /reports/install
            '
      - name: Check Debian install, upgrade and removal
        run: |
          docker run --rm --platform linux/${{ matrix.docker_arch }} \
            -v "$PWD/dist:/artifacts:ro" \
            -v "$RUNNER_TEMP/deb-upgrade:/upgrade:ro" \
            -v "$PWD/sweetpad-cli/ci:/validation/sweetpad-cli/ci:ro" \
            -v "$RUNNER_TEMP/package-smoke:/reports" ubuntu:24.04 bash -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -yqq python3 ca-certificates
              python3 /validation/sweetpad-cli/ci/check-linux-deb.py --package "$(find /artifacts -name "*.deb")" --upgrade "$(find /upgrade -name "*.deb")" --out /reports/debian
            '
      - name: Check signed APT install and upgrade
        run: |
          python3 sweetpad-cli/ci/check-linux-apt.py --package-dir dist --upgrade-dir "$RUNNER_TEMP/deb-upgrade" --out "$RUNNER_TEMP/package-smoke/apt"
      - name: Check CLI without glibc
        run: |
          docker run --rm --platform linux/${{ matrix.docker_arch }} -v "$PWD/dist:/artifacts:ro" alpine:3.22 sh -euc '
            mkdir /tool
            tar -xzf /artifacts/*.tar.gz -C /tool
            /tool/sweetpad --version
            /tool/sweetpad-dap --help
          '
      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-install-report
          path: ${{ runner.temp }}/package-smoke/**/*.json
          if-no-files-found: warn
      - name: Upload verified release package
        uses: actions/upload-artifact@v7
        with:
          name: cli-tarball-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  host-installs:
    name: ${{ matrix.image }} / ${{ matrix.arch }} packaged Swift helpers (no Swift)
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "ubuntu:24.04", arch: x64, docker_arch: amd64, runner: ubuntu-24.04}
          - {image: "ubuntu:24.04", arch: arm64, docker_arch: arm64, runner: ubuntu-24.04-arm}
          - {image: "debian:12", arch: x64, docker_arch: amd64, runner: ubuntu-24.04}
          - {image: "debian:12", arch: arm64, docker_arch: arm64, runner: ubuntu-24.04-arm}
          - {image: "debian:13", arch: x64, docker_arch: amd64, runner: ubuntu-24.04}
          - {image: "debian:13", arch: arm64, docker_arch: arm64, runner: ubuntu-24.04-arm}
          - {image: "archlinux:base", arch: x64, docker_arch: amd64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball-linux-${{ matrix.arch }}
          path: dist
      - name: Run the helpers from the archive
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/helpers"
          docker run --rm --platform linux/${{ matrix.docker_arch }} \
            -v "$PWD/dist:/artifacts:ro" -v "$PWD/sweetpad-cli/ci:/validation:ro" \
            -v "$RUNNER_TEMP/helpers:/reports" "$IMAGE" bash -euc '
              if command -v apt-get >/dev/null; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -yqq python3 ca-certificates libsqlite3-0 libstdc++6
              else
                pacman -Syu --noconfirm
                pacman -S --needed --noconfirm python sqlite gcc-libs
              fi
              python3 /validation/check-linux-helpers.py --archive "$(find /artifacts -maxdepth 1 -name "*.tar.gz")" --out /reports/run
            '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-helpers-${{ matrix.arch }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/helpers/run/*
          if-no-files-found: warn
