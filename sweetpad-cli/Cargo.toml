[package]
name = "sweetpad-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "The `sweetpad` command-line interface over sweetpad-core."

# A pure native binary, distributed via Homebrew.
[[bin]]
name = "sweetpad"
path = "src/bin/sweetpad.rs"

[dependencies]
sweetpad-lib.workspace = true
sweetpad-core.workspace = true
serde_json.workspace = true
base64.workspace = true
cassowary.workspace = true
clap.workspace = true
clap_complete.workspace = true
dialoguer.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
libc.workspace = true
png.workspace = true
flate2.workspace = true
flatbuffers.workspace = true
moxcms.workspace = true
hayro.workspace = true
resvg.workspace = true
svgtypes.workspace = true
rsa.workspace = true
des.workspace = true
aes.workspace = true
unicode-normalization.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
minreq = { workspace = true, features = ["https-rustls-probe"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
minreq = { workspace = true, features = ["https-native-tls"] }

[lints]
workspace = true
